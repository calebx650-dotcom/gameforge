[package]
name = "gameforge"
version = "0.1.0"
description = "GameForge desktop shell"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# keyring 3.x ships with zero default backend features enabled — without
# explicitly picking one per platform, Entry::set_password() silently
# no-ops instead of erroring (confirmed live: a set/get round trip returned
# None with no feature flags set). These are the exact combinations the
# crate's own Cargo.toml recommends per OS (see its docs.rs metadata).
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["linux-native-sync-persistent"] }

[lib]
name = "gameforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
